name: Keep Supabase awake

# Supabase pauses free projects after 7 days without database activity.
# This pings the site's /api/health twice a week, which runs one tiny query.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables →
#   New variable  SITE_URL = https://your-site (no trailing slash)
on:
  schedule:
    - cron: '17 3 * * 1,4' # Mondays and Thursdays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::Set the SITE_URL repository variable to enable keep-alive."
            exit 0
          fi
          for attempt in 1 2 3; do
            body=$(curl -fsS --max-time 30 "$SITE_URL/api/health") && echo "$body" && echo "$body" | grep -q '"db":"ok"' && exit 0
            echo "Attempt $attempt failed; retrying in 20s"; sleep 20
          done
          echo "::error::Health check failed. The Supabase project may be paused: unpause it in the dashboard."
          exit 1
